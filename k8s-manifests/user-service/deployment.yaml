apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user-service
          image: distrischool-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # --- Configurações de Banco de Dados ---
            - name: SPRING_DATASOURCE_URL # <<< Nome padrão Spring
              value: "jdbc:postgresql://postgres-service:5432/distrischool_db" # <<< Banco unificado
            - name: SPRING_DATASOURCE_USERNAME # <<< Nome padrão Spring
              value: "admin" # <<< Credencial correta
            - name: SPRING_DATASOURCE_PASSWORD # <<< Nome padrão Spring
              value: "admin" # <<< Credencial correta
            # --- Configurações de Schema ---
            - name: SPRING_FLYWAY_SCHEMAS
              value: "user_schema" # <<< Schema específico
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: "user_schema" # <<< Schema específico

            # --- Configurações do RabbitMQ ---
            - name: SPRING_RABBITMQ_HOST # <<< Nome padrão Spring
              value: "rabbitmq-service"
            - name: SPRING_RABBITMQ_PORT # <<< Nome padrão Spring
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME # <<< Nome padrão Spring
              value: "admin" # <<< Credencial correta
            - name: SPRING_RABBITMQ_PASSWORD # <<< Nome padrão Spring
              value: "admin" # <<< Credencial correta